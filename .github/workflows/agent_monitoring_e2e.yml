name: Agent fleet monitoring E2E

# Consolidated, multi-platform proof that EDAMAME monitors the whole supported
# agent fleet (Cursor, Claude Code, Claude Desktop, Codex, Hermes, OpenClaw)
# using REAL agents -- NO synthetic transcripts, no seeded observer roots, no
# hand-crafted behavioral models.
#
# On each of macOS / Windows / Linux it:
#   1. installs every plugin from its checked-out repo,
#   2. installs the real agent CLIs (claude, codex) and DRIVES them headlessly
#      with real provider keys, producing genuine on-disk transcripts,
#   3. verifies EDAMAME's host-side transcript observer DISCOVERS each driven
#      agent from its real transcripts,
#   4. verifies pausing a driven agent's observer raises its unsecured_<agent>
#      threat (soft),
#   5. builds a REAL behavioral model from a driven agent, then drives a genuine
#      divergent egress THROUGH that agent and asserts a DIVERGENCE verdict, and
#   6. asserts the host blast-radius surface.
#
# Real-coverage floor (HARD): at least one real-driver agent (claude_code or
# codex) MUST be installed, driven, and detected. A green run made only of skips
# would be indistinguishable from the old synthetic gate and is rejected.
#
# Agents that cannot be driven headlessly in hosted CI (cursor, claude_desktop,
# hermes, openclaw) are SKIPPED with an explicit logged reason -- never faked.
#
# The divergence leg requires the agent's persistent shell to be bash (its
# /dev/udp egress is what lands the session in the model's parent scope), so it
# runs only on Linux; macOS / Windows still do real install + drive + detection
# + blast radius.
#
# This workflow gates the EDAMAME release: edamame_app/release_all.sh lists it in
# AGENT_PLUGIN_E2E_WORKFLOWS, so a red run blocks the release. Hard failures:
# real-driver-agent install + real drive + observer detection, the real-coverage
# floor, and the fleet-wide divergence (Linux) + blast-radius legs. Soft (warn
# only): the unsecured_<agent> toggle and skip-agent install. All cross-agent
# orchestration lives in tests/e2e/run_fleet_monitoring.py.

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'tests/e2e/run_fleet_monitoring.py'
      - 'tests/e2e/supported_agents.py'
      - 'tests/e2e/triggers/**'
      - 'supported_agents/index.json'
      - '.github/workflows/agent_monitoring_e2e.yml'
  pull_request:
    paths:
      - 'tests/e2e/run_fleet_monitoring.py'
      - 'tests/e2e/supported_agents.py'
      - 'tests/e2e/triggers/**'
      - 'supported_agents/index.json'
      - '.github/workflows/agent_monitoring_e2e.yml'
  workflow_dispatch:
    inputs:
      agents:
        description: 'CSV of agent_types to run (empty = all in registry)'
        required: false
        default: ''
      skip_divergence:
        description: 'Force-skip the divergence leg (it already auto-skips off Linux)'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  fleet:
    name: Fleet monitoring (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # ── Checkout agent_security + all six plugin repos as siblings ─────
      - name: Checkout agent_security
        uses: actions/checkout@v4
        with:
          path: agent_security

      - name: Checkout edamame_cursor
        uses: actions/checkout@v4
        with:
          repository: edamametechnologies/edamame_cursor
          path: edamame_cursor

      - name: Checkout edamame_claude_code
        uses: actions/checkout@v4
        with:
          repository: edamametechnologies/edamame_claude_code
          path: edamame_claude_code

      - name: Checkout edamame_claude_desktop
        uses: actions/checkout@v4
        with:
          repository: edamametechnologies/edamame_claude_desktop
          path: edamame_claude_desktop

      - name: Checkout edamame_codex
        uses: actions/checkout@v4
        with:
          repository: edamametechnologies/edamame_codex
          path: edamame_codex

      - name: Checkout edamame_hermes
        uses: actions/checkout@v4
        with:
          repository: edamametechnologies/edamame_hermes
          path: edamame_hermes

      - name: Checkout edamame_openclaw
        uses: actions/checkout@v4
        with:
          repository: edamametechnologies/edamame_openclaw
          path: edamame_openclaw

      # ── EDAMAME Posture daemon (connected + packet capture) ────────────
      # Connected so the runner IP is lifted and the edamame_cli install
      # below resolves the current release instead of the 1.2.0 fallback.
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          packet_capture: true
          wait_for_api: true
          checkout: false
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}

      - name: Set EDAMAME_POSTURE env var
        shell: bash
        run: echo "EDAMAME_POSTURE=$EDAMAME_BINARY_PATH" >> "$GITHUB_ENV"

      # ── Toolchains ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Real agent CLIs (no synthetic transcripts -- these produce them) ─
      # claude_code and codex are the two headlessly-drivable agents. Install
      # both on every OS so the real-coverage floor can be met on each leg
      # (the driver self-selects whichever it can actually drive + detect).
      - name: Install real agent CLIs (claude, codex)
        shell: bash
        run: |
          set -x
          npm install -g @anthropic-ai/claude-code @openai/codex || true
          echo "--- versions ---"
          command -v claude  >/dev/null 2>&1 && claude --version || echo "claude CLI not on PATH"
          command -v codex   >/dev/null 2>&1 && codex --version  || echo "codex CLI not on PATH"
          # Make the global npm bin resolvable under sudo on Linux (the driver
          # runs as root with a forwarded PATH; the daemon observer is root too).
          NPM_BIN="$(npm prefix -g)/bin"
          echo "npm global bin: $NPM_BIN"
          [ -d "$NPM_BIN" ] && echo "$NPM_BIN" >> "$GITHUB_PATH" || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install C compiler (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          /c/msys64/usr/bin/pacman.exe -S --noconfirm mingw-w64-x86_64-gcc
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"
          /c/msys64/mingw64/bin/gcc.exe --version
          echo "CC=C:\msys64\mingw64\bin\gcc.exe" >> "$GITHUB_ENV"

      # ── PSK + MCP server (intent push target) ──────────────────────────
      - name: Generate PSK and start MCP server
        shell: bash
        run: |
          PSK=$("$EDAMAME_POSTURE" mcp-generate-psk 2>&1 | head -n1) || true
          if [ -z "$PSK" ] || [ ${#PSK} -lt 32 ]; then
            PSK=$(sudo "$EDAMAME_POSTURE" mcp-generate-psk 2>&1 | head -n1) || true
          fi
          if [ -z "$PSK" ] || [ ${#PSK} -lt 32 ]; then
            echo "FAIL: could not generate PSK (got: '$PSK')"
            exit 1
          fi
          echo "::add-mask::$PSK"
          echo "EDAMAME_PSK=$PSK" >> "$GITHUB_ENV"
          echo "PSK generated (${#PSK} chars)"

          echo "--- Starting MCP server with PSK ---"
          MCP_CMD="$EDAMAME_POSTURE"
          if [ "$RUNNER_OS" != "Windows" ]; then
            MCP_CMD="sudo $EDAMAME_POSTURE"
          fi
          for attempt in 1 2 3 4 5; do
            $MCP_CMD mcp-stop 2>/dev/null || true
            sleep 3
            if $MCP_CMD mcp-start 3000 "$PSK" 2>&1; then
              echo "MCP server started on port 3000"
              break
            fi
            echo "MCP start attempt $attempt/5 failed, retrying..."
            if [ "$attempt" -eq 5 ]; then
              echo "FAIL: could not start MCP server after 5 attempts"
              exit 1
            fi
          done

      - name: Install edamame_cli
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://raw.githubusercontent.com/edamametechnologies/edamame_cli/main/install.sh \
              | sh -s --
            EC=$(command -v edamame_cli.exe 2>/dev/null || command -v edamame_cli 2>/dev/null || echo "$HOME/edamame_cli.exe")
          else
            curl --proto '=https' --tlsv1.2 -sSf \
              https://raw.githubusercontent.com/edamametechnologies/edamame_cli/main/install.sh \
              | sudo -E sh -s --
            EC=$(command -v edamame_cli 2>/dev/null || echo /usr/local/bin/edamame_cli)
          fi
          echo "EDAMAME_CLI=$EC" >> "$GITHUB_ENV"
          "$EC" --version

      # ── Drive the whole fleet ──────────────────────────────────────────
      - name: Run fleet monitoring driver
        timeout-minutes: 40
        shell: bash
        working-directory: agent_security
        env:
          EDAMAME_CLI: ${{ env.EDAMAME_CLI }}
          EDAMAME_MCP_PSK: ${{ env.EDAMAME_PSK }}
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CURSOR_REPO: ${{ github.workspace }}/edamame_cursor
          CLAUDE_REPO: ${{ github.workspace }}/edamame_claude_code
          CLAUDE_DESKTOP_REPO: ${{ github.workspace }}/edamame_claude_desktop
          CODEX_REPO: ${{ github.workspace }}/edamame_codex
          HERMES_REPO: ${{ github.workspace }}/edamame_hermes
          OPENCLAW_REPO: ${{ github.workspace }}/edamame_openclaw
          # The divergence leg drives a real /dev/udp egress through the agent's
          # persistent bash shell, which only exists on Linux. Off Linux we still
          # do real install + drive + detection + blast radius, just not divergence.
          FLEET_SKIP_DIVERGENCE: ${{ (github.event.inputs.skip_divergence == 'true' || runner.os != 'Linux') && '1' || '' }}
          EDAMAME_AGENTS: ${{ github.event.inputs.agents || '' }}
        run: |
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          if [ "$RUNNER_OS" = "Linux" ]; then
            # The posture daemon runs as root for packet capture, so its
            # transcript observer resolves agent roots under /root. Run the
            # driver (installs + PSK seeding + edamame_cli) as root with
            # HOME=/root so the installed agents land where the daemon looks.
            # PATH is forwarded so the node/python toolchains stay resolvable
            # under sudo's secure_path.
            PYBIN=$(command -v "$PY")
            sudo -E env "PATH=$PATH" "HOME=/root" "$PYBIN" tests/e2e/run_fleet_monitoring.py
          else
            "$PY" tests/e2e/run_fleet_monitoring.py
          fi

      # ── Teardown ───────────────────────────────────────────────────────
      - name: Stop daemon
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$EDAMAME_POSTURE" stop 2>/dev/null || true
          else
            sudo "$EDAMAME_POSTURE" stop 2>/dev/null || true
          fi
          echo "Daemon stopped"

      # ── Slack alert ────────────────────────────────────────────────────
      - name: Slack alert on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: "C072J0U9TH7"
          slack-message: |
            *agent_security fleet monitoring E2E failed*
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            OS: ${{ matrix.os }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true
